    <div id="boardUI" style="display:none; opacity:0; transition: opacity 0.5s ease;">
        <button id="backToMap" class="premium-btn">← Retourner à la Carte</button>
    </div>

    <script src="main.js" type="module"></script>
    <script src="lebanon.js" type="module"></script>
    <script src="morocco.js" type="module"></script>
    <script>
        const moroccoIsland = document.getElementById('moroccoIsland');
        const lebanonIsland = document.getElementById('lebanonIsland');

        moroccoIsland.addEventListener('click', () => {
            if (window.switchToMorocco) {
                window.switchToMorocco();
            } else {
                alert('Morocco Board loading...');
            }
        });

        lebanonIsland.addEventListener('click', () => {
            // Transition to 3D Board
            if (window.switchToLebanon) {
                window.switchToLebanon();
            } else {
                alert('Lebanon Board loading...');
            }
        });
    </script>
