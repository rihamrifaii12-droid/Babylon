<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Monopoly 3D - Babylon.js</title>
  </head>
  <body>
    <canvas id="renderCanvas"></canvas>
    <div id="ui-layer">
      <h1>Monopoly 3D</h1>
      <div id="game-info">
        <p><span id="current-player" style="font-weight: bold; border-bottom: 2px solid #FF5252;">Player 1</span>'s Turn</p>
        <p>Money: <span id="player-money">$1500</span></p>
        <button id="roll-button">Roll Dice</button>
      </div>
      <div id="event-log"></div>
    </div>
    <script type="module" src="/main.js"></script>
  </body>
</html>
